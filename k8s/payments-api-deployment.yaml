apiVersion: apps/v1
kind: Deployment

metadata:
  name: payments-api
  namespace: gamestore

spec:
  replicas: 1

  selector:
    matchLabels:
      app: payments-api

  template:
    metadata:
      labels:
        app: payments-api

    spec:
      containers:
      - name: payments-api
        image: payments-api:latest

        ports:
        - containerPort: 8080