apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: gamestore

spec:
  replicas: 1

  selector:
    matchLabels:
      app: catalog-api

  template:
    metadata:
      labels:
        app: catalog-api

    spec:
      containers:
      - name: catalog-api
        image: catalog-api:latest

        ports:
        - containerPort: 8080