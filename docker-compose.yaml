services:

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  users-api:
    build:
      context: ../game-store
      dockerfile: src/microservices/UsersAPI/Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      - postgres
      - rabbitmq

  catalog-api:
    build:
      context: ../game-store
      dockerfile: src/microservices/CatalogAPI/Dockerfile
    ports:
      - "5002:8080"
    depends_on:
      - postgres
      - rabbitmq

  payments-api:
    build:
      context: ../game-store
      dockerfile: src/microservices/PaymentsAPI/Dockerfile
    ports:
      - "5003:8080"
    depends_on:
      - rabbitmq

  notifications-api:
    build:
      context: ../game-store
      dockerfile: src/microservices/NotificationsAPI/Dockerfile
    ports:
      - "5004:8080"
    depends_on:
      - rabbitmq

  kong:
    image: kong:3.7
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml
    depends_on:
      - users-api
      - catalog-api
      - payments-api


  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - users-api
      - catalog-api

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      - mongodb

volumes:
  postgres_data: